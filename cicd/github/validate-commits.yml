name: Validate Commit Messages
on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  validate-commits:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Dedicated action — handles push vs PR logic internally
      - name: Validate commit messages
        uses: wagoid/commitlint-github-action@v6
        # Reads commitlint.config.js from the repo root automatically
